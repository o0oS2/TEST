plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.automes.oqc'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.automes.oqc.viewer'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Ký bằng khóa debug để cài thẳng được (dùng nội bộ). Muốn phát hành riêng: đổi signingConfig.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += [
                'META-INF/versions/**', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*',
                'META-INF/NOTICE*', 'META-INF/INDEX.LIST', 'META-INF/*.kotlin_module',
                'META-INF/MANIFEST.MF', 'META-INF/AL2.0', 'META-INF/LGPL2.1'
            ]
        }
    }
}

dependencies {
    // Fix lỗi trùng class kotlin-stdlib (1.8.22 vs jdk7/jdk8 1.6.21): ép đồng bộ phiên bản Kotlin
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.10'
    implementation 'org.slf4j:slf4j-nop:1.7.36'
}
