name: Build APK

on:
  workflow_dispatch:        # bấm tay trong tab Actions
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Doi ten APK
        run: cp app/build/outputs/apk/release/app-release.apk AutoMesOQC_Xem.apk

      - name: Luu file APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoMesOQC_Xem-apk
          path: AutoMesOQC_Xem.apk

      - name: Dang len Releases (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AutoMesOQC_Xem.apk
